<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Font fallback for Armenian documents (see docs/PLAN.md, risk R1).
  Noto Serif Armenian has Armenian letters and ֏ but NO digits, Latin or ☐/☑.
  LibreOffice asks fontconfig for a fallback per missing glyph; by default it picked "Noto Color Emoji"
  (grey, wide digits; ☑ as a color emoji). We:
    1. reject the emoji font entirely (printed documents never need emoji), and
    2. define the fallback order for our document fonts: Latin/digits from Noto Serif/Sans,
       ☐ ☑ from DejaVu Sans.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*NotoColorEmoji*</glob>
      <pattern><patelt name="family"><string>Noto Color Emoji</string></patelt></pattern>
    </rejectfont>
  </selectfont>

  <alias binding="strong">
    <family>Noto Serif Armenian</family>
    <prefer>
      <family>Noto Serif Armenian</family>
      <family>Noto Serif</family>
      <family>DejaVu Sans</family>
      <family>Noto Sans Symbols2</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Noto Sans Armenian</family>
    <prefer>
      <family>Noto Sans Armenian</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Noto Sans Symbols2</family>
    </prefer>
  </alias>
</fontconfig>
