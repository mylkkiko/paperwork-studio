# Continuous integration. No secrets: every value below is a test-only placeholder.
#   checks         every push / PR   typecheck backend + frontend, i18n check, frontend unit tests
#   backend-tests  every push / PR   Jest + Supertest with coverage threshold, real PostgreSQL + Gotenberg (Armenian fonts)
#   e2e            main only         whole stack via docker compose + Playwright
name: CI

on:
  push:
  pull_request:

# A new push to the same branch (or PR) cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Translations (hy / en / ru)
        working-directory: frontend
        run: npm run i18n:check

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paperwork
          POSTGRES_PASSWORD: paperwork
          POSTGRES_DB: paperwork_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U paperwork"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      gotenberg:
        # Same base image as docker/gotenberg; its font fallback config is copied in below
        # (service containers start before checkout, so they can't be built from the repo).
        image: gotenberg/gotenberg:8.40.0
        ports: ['3010:3000']
    env:
      TEST_DATABASE_URL: postgresql://paperwork:paperwork@localhost:5433/paperwork_test?schema=public
      GOTENBERG_URL: http://localhost:3010
    steps:
      - uses: actions/checkout@v4

      - name: Gotenberg — Armenian font fallback (same as docker/gotenberg)
        env:
          GOTENBERG: ${{ job.services.gotenberg.id }}
        run: |
          docker cp docker/gotenberg/fonts.conf "$GOTENBERG":/etc/fonts/local.conf
          docker exec -u root "$GOTENBERG" fc-cache -f
          # restart so LibreOffice starts with the new font config
          docker restart "$GOTENBERG"
          for i in $(seq 1 60); do
            curl -sf http://localhost:3010/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3010/health
          docker exec "$GOTENBERG" fc-match -s "Noto Serif Armenian" | head -3

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Tests with coverage threshold
        working-directory: backend
        run: npm run test:coverage

  e2e:
    name: e2e
    # only for main: pushes to main and pull requests into main
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # test-only values for docker compose (no secrets)
      JWT_SECRET: ci-only-jwt-secret-not-for-real-use
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Wait until the app answers
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3100/login >/dev/null && curl -sf http://localhost:3100/api/health >/dev/null && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs --tail 100
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --tail 300

      - name: Upload Playwright report and screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
